name: Managed probe

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    name: Tests (${{ matrix.suite }})
    # Fork main/tag pushes skip runners; PRs and manual dispatch remain available.
    if: github.repository == 'sotsera/spar' || github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [fast, processes, development, delivery, packages]
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_TIMING: 'true'
      NPM_CONFIG_LOGS_DIR: ${{ github.workspace }}/artifacts/npm
      NPM_CONFIG_LOGS_MAX: '200'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            eng/bridge-client-tests/package-lock.json
            fixtures/Spar.NativeSample/frontend/package-lock.json
            samples/Spar.NativeSample/frontend/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run fixed suite
        shell: pwsh
        run: ./eng/Test.ps1 -Suite ${{ matrix.suite }}

      - name: Preserve suite status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-suite-${{ matrix.suite }}-status
          overwrite: true
          path: artifacts/ci/suite-${{ matrix.suite }}.json
          retention-days: ${{ job.status == 'success' && 14 || 30 }}
          if-no-files-found: error

      - name: Preserve concise evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-suite-${{ matrix.suite }}-results
          overwrite: true
          retention-days: ${{ job.status == 'success' && 14 || 30 }}
          path: |
            artifacts/suites/**/receipt.json
            artifacts/suites/**/results.json
            artifacts/suites/**/*-startup.json
            artifacts/suites/**/inspection-disabled.json
            artifacts/suites/**/packages.json
            artifacts/suites/**/spar-publish.json
            artifacts/suites/**/test-results/**
            artifacts/npm/*-timing.json
          if-no-files-found: warn

      - name: Preserve failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-suite-${{ matrix.suite }}-diagnostics-${{ github.run_attempt }}
          retention-days: 30
          path: |
            artifacts/ci/suite-*.json
            artifacts/npm/*
            artifacts/suites/**/receipt.json
            artifacts/suites/**/results.json
            artifacts/suites/**/*.log
            artifacts/suites/**/*.jsonl
            artifacts/suites/**/*-startup.json
            artifacts/suites/**/steps.json
            artifacts/suites/**/*.sha256
            artifacts/suites/**/*-snapshot.json
            artifacts/suites/**/frontend-logs.json
            artifacts/suites/**/consumer-path.txt
            artifacts/suites/**/*.png
            artifacts/suites/**/*.bmp
            artifacts/suites/**/spar-publish.json
            artifacts/suites/**/test-results/**
            artifacts/hot-reload/**/watch.log
            artifacts/hot-reload/**/sources.sha256
          if-no-files-found: warn

  gate:
    name: Windows managed probe
    needs: [suites]
    if: always() && (github.repository == 'sotsera/spar' || github.event_name != 'push')
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: test-suite-*-status
          merge-multiple: true
          path: artifacts/ci/suites

      - name: Audit every required suite
        if: always()
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node eng/ci/gate.mjs

      - name: Preserve aggregate result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: managed-probe-results
          overwrite: true
          path: artifacts/ci/results.json
          retention-days: ${{ job.status == 'success' && 14 || 30 }}
          if-no-files-found: warn
