name: Managed probe

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows managed probe
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'

      - name: Build
        run: dotnet build Spar.slnx --disable-build-servers

      - name: Test bridge contracts and real dotnet watch behavior
        run: dotnet test --solution Spar.slnx --no-build

      - name: Check generated TypeScript client
        working-directory: eng/bridge-client-tests
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Install and check the sample SPA
        working-directory: samples/Spar.NativeSample/frontend
        run: |
          npm ci --ignore-scripts --include=optional
          npm run check
          npm run build

      - name: Test owned SPA session and HMR
        shell: pwsh
        run: ./eng/Test-DevelopmentSession.ps1 -EvidenceDirectory artifacts/development/ci

      - name: Test native backend Hot Reload and retirement
        shell: pwsh
        run: ./eng/Test-BackendUpdates.ps1 -EvidenceDirectory artifacts/backend-loop/ci

      - name: Test native CoreCLR bridge
        shell: pwsh
        run: >-
          ./eng/Test-Bridge.ps1
          -Executable samples/Spar.NativeSample/bin/Debug/net10.0-windows/win-x64/Spar.NativeSample.exe
          -EvidenceDirectory artifacts/bridge/ci-coreclr

      - name: Test native CoreCLR lifecycle
        shell: pwsh
        run: >-
          ./eng/Test-NativeHost.ps1
          -Executable samples/Spar.NativeSample/bin/Debug/net10.0-windows/win-x64/Spar.NativeSample.exe
          -EvidenceDirectory artifacts/native/ci-coreclr

      - name: Publish strict NativeAOT sample
        run: dotnet publish samples/Spar.NativeSample -c Release -o artifacts/native/publish --disable-build-servers

      - name: Test copied NativeAOT lifecycle
        shell: pwsh
        run: |
          $copyPath = Join-Path $env:RUNNER_TEMP ('spar-native-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $copyPath | Out-Null
          Get-ChildItem -LiteralPath artifacts/native/publish -File |
            Where-Object Extension -ne '.pdb' | Copy-Item -Destination $copyPath
          $payload = @(Get-ChildItem -LiteralPath $copyPath -File | Sort-Object Name | Select-Object -ExpandProperty Name)
          $expected = @('Spar.NativeSample.exe', 'WebView2-LICENSE.txt', 'WebView2-NOTICE.txt', 'WebView2Loader.dll') | Sort-Object
          if (Compare-Object $payload $expected) { throw 'Unexpected AOT payload: build tools/managed runtime must not ship.' }
          ./eng/Test-NativeHost.ps1 -Executable (Join-Path $copyPath 'Spar.NativeSample.exe') `
            -ExpectedMode NativeAOT -EvidenceDirectory artifacts/native/ci-aot
          ./eng/Test-Bridge.ps1 -Executable (Join-Path $copyPath 'Spar.NativeSample.exe') `
            -ExpectedMode NativeAOT -EvidenceDirectory artifacts/bridge/ci-aot

      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: managed-probe-evidence
          path: |
            artifacts/hot-reload/**/watch.log
            artifacts/hot-reload/**/sources.sha256
            **/TestResults/**
            artifacts/native/ci-*/receipt.json
            artifacts/native/ci-*/**/*.jsonl
            artifacts/native/ci-*/**/*.log
            artifacts/bridge/ci-*/receipt.json
            artifacts/bridge/ci-*/**/*.jsonl
            artifacts/bridge/ci-*/**/*.log
            artifacts/development/ci/receipt.json
            artifacts/development/ci/**/coordinator.jsonl
            artifacts/development/ci/**/*.log
            artifacts/backend-loop/ci/receipt.json
            artifacts/backend-loop/ci/**/steps.json
            artifacts/backend-loop/ci/**/sources.initial.sha256
            artifacts/backend-loop/ci/**/coordinator.jsonl
            artifacts/backend-loop/ci/**/*.log
          if-no-files-found: warn
