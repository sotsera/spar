# Spar CI (decision "CI on GitHub Actions"). Prepared before the repository exists; first run on the first push.
# Before that push: pin every action to a full commit SHA (supply-chain default), and check that the window tests
# can run on the hosted Windows runner (it may need a self-hosted one with a desktop session).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Results go where AGENTS.md puts them; the upload step collects them.
  SPAR_TEST_RESULTS: ${{ github.workspace }}/artifacts/test-results
  # A CI build: deterministic paths, and the committed contract snapshots are verified (SPAR100), never rewritten.
  ContinuousIntegrationBuild: "true"

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Size limits
        run: dotnet run eng/check-size.cs

      - name: TypeScript SDK (TypeScript 6 and 7, Vitest)
        working-directory: src/Spar.Client
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          # The browser tests serve the compiled SDK from obj/dist.
          npm run build

      - name: The documentation check's packages (tests/AppModel)
        working-directory: tests/AppModel
        run: npm ci --ignore-scripts

      - name: Build
        run: dotnet build Spar.slnx -c Debug

      - name: Chromium for the browser tests
        shell: bash
        run: |
          # Playwright's headless shell only; --with-deps adds its system libraries on Linux.
          script=$(find tests/WireShapes.EndToEndTests/bin -name playwright.ps1 | head -1)
          pwsh "$script" install --with-deps --only-shell chromium

      - name: Test (CoreCLR)
        run: dotnet test --solution Spar.slnx -c Debug --no-build

      - name: Test (NativeAOT lane)
        shell: bash
        run: |
          # The same test projects published with NativeAOT (plan section 5); the generator tests compile C# in memory
          # and stay on CoreCLR.
          for project in tests/Spar.Tests tests/WireShapes.Tests samples/Notebook.Tests; do
            name=$(basename "$project")
            dotnet publish "$project" -c Release -p:SparTestLane=Aot -o "artifacts/aot/$name"
            # xUnit's in-process runner exits 0 when it ran no test; an empty run is a failure (fixture rules).
            output=$("artifacts/aot/$name/$name") || { echo "$output"; exit 1; }
            echo "$output"
            echo "$output" | grep -qE "Total: [1-9]" || { echo "No tests ran in $name."; exit 1; }
          done

      - name: Build with -mt
        run: dotnet build Spar.slnx -c Debug -mt -nodeReuse:false

      - name: Build tests (a clean copy, an unchanged build, the production boundary)
        # Not in Spar.slnx: they copy the tree under artifacts/build-tests/ and build it in isolation, in minutes.
        run: dotnet test --project tests/Spar.BuildTests

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: ignore
