<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Window tests: framed file input</title>
<style>
  html, body { margin: 0; height: 100%; }
  input { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<input id="f" type="file" aria-label="framed file">
<script>
const input = document.getElementById('f');
for (const type of ['click', 'change', 'cancel']) {
  input.addEventListener(type, (event) => parent.postMessage({ framed: type, trusted: event.isTrusted, files: input.files.length }, '*'));
}
</script>
</body>
</html>
