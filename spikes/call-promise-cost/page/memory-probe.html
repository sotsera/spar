<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>memory probe</title>
</head>
<body>
  <script>
    // Does performance.memory move with allocation in this host? Reports a few readings around 1 MB and 10 MB of objects.
    (async () => {
      const read = () => performance.memory ? performance.memory.usedJSHeapSize : -1;
      const out = { crossOriginIsolated: self.crossOriginIsolated, hasMemory: !!performance.memory, hasGc: typeof gc === "function", readings: [] };
      const keep = [];
      for (const count of [0, 12500, 125000, 0]) {
        if (typeof gc === "function") gc();
        const before = read();
        const batch = new Array(count);
        for (let i = 0; i < count; i++) batch[i] = { a: i, b: i, c: i, d: i, e: i, f: i };
        keep.push(batch);
        const after = read();
        await new Promise(r => setTimeout(r, 100));
        out.readings.push({ count, before, after, delta: after - before, after100ms: read() - before });
      }
      const t = [];
      for (let i = 0; i < 2000; i++) t.push(performance.now());
      const steps = t.slice(1).map((x, i) => x - t[i]).filter(d => d > 0);
      out.nowResolutionMs = steps.length ? Math.min(...steps) : 0;
      await fetch("/results", { method: "POST", body: JSON.stringify({ probe: out, details: {} }) });
      await fetch("/_spar/done");
    })();
  </script>
</body>
</html>
