<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <script>
    // Spike timing (desktop-origin): the React bundle ends its start with POST /_spar/ready. Add the page's own
    // navigation-start-relative times (DOMContentLoaded and ready) to that request.
    (() => {
      let dcl = NaN;
      addEventListener("DOMContentLoaded", () => { dcl = performance.now(); });
      const original = fetch;
      window.fetch = (input, init) => {
        if (typeof input === "string" && input === "/_spar/ready") {
          const nav = performance.getEntriesByType("navigation")[0];
          input += `?page-dcl=${dcl.toFixed(1)}&page-ready=${performance.now().toFixed(1)}` +
            `&page-response-end=${nav ? nav.responseEnd.toFixed(1) : "NaN"}&page-dcl-entry=${nav ? nav.domContentLoadedEventStart.toFixed(1) : "NaN"}`;
        }
        return original(input, init);
      };
    })();
  </script>
  <script type="module" crossorigin src="/assets/index-B66cP3hB.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
