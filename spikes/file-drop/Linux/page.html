<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>file-drop spike</title>
  <style>
    html, body { margin: 0; height: 100%; font: 14px sans-serif; }
    body { display: flex; }
    #handled, #unhandled { flex: 1; display: flex; align-items: center; justify-content: center; }
    #handled { background: #dfe; }
    #unhandled { background: #fed; }
  </style>
</head>
<body>
  <div id="handled">handled</div>
  <div id="unhandled">unhandled</div>
  <script>
    // The page side of the Linux probe: the left area takes drops, the right one has no handler. A drop on the left
    // reports what the page could see, and reads the first file's text to show its content is there.
    const post = (value) => window.webkit.messageHandlers.spar.postMessage(JSON.stringify(value));
    const handled = document.getElementById("handled");
    let dragEvents = [];

    for (const type of ["dragenter", "dragover", "dragleave"]) {
      handled.addEventListener(type, (e) => {
        if (type === "dragenter" && dragEvents.length === 0) {
          post({ kind: "dragenter" });
        }
        dragEvents.push(type);
        if (type !== "dragleave") {
          e.preventDefault();
          e.dataTransfer.dropEffect = "copy";
        }
      });
    }

    handled.addEventListener("drop", async (e) => {
      e.preventDefault();
      const started = performance.now();
      const transfer = e.dataTransfer;
      const files = Array.from(transfer.files);
      const items = Array.from(transfer.items);
      const entries = items.map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null));
      const report = {
        kind: "drop",
        x: e.clientX,
        y: e.clientY,
        area: document.elementFromPoint(e.clientX, e.clientY)?.id ?? null,
        dragEvents,
        types: Array.from(transfer.types),
        uriList: transfer.getData("text/uri-list"),
        text: transfer.getData("text/plain"),
        fileCount: files.length,
        files: files.slice(0, 5).map((f) => ({ name: f.name, size: f.size, type: f.type, path: f.path ?? null })),
        entries: entries.slice(0, 5).map((en) => (en ? { name: en.name, isDirectory: en.isDirectory } : null)),
        hasFileSystemHandle: items.length > 0 && typeof items[0].getAsFileSystemHandle === "function",
      };
      dragEvents = [];

      if (files.length > 0 && files[0].size < 1024) {
        try {
          report.firstText = await files[0].text();
        } catch (err) {
          report.firstTextError = String(err);
        }
      }

      const folder = entries.find((en) => en && en.isDirectory);
      if (folder) {
        report.folderChildren = await new Promise((resolve) => {
          folder.createReader().readEntries((list) => resolve(list.length), (err) => resolve(String(err)));
        });
      }

      report.reportAfter = performance.now() - started;
      post(report);
    });

    post({ kind: "ready" });

    // A drop the page makes itself: what does the isolated world see of it?
    handled.dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, clientX: 10, clientY: 20 }));
  </script>
</body>
</html>
