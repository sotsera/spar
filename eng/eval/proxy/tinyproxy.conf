# Only CONNECT tunnels to port 443 of the hosts in `allowed`; everything else is refused.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Connect
MaxClients 100
ConnectPort 443
Filter "/etc/tinyproxy/allowed"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
DisableViaHeader Yes
